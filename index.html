<form
  class="quote-form reveal"
  action="https://formsubmit.co/quotes@solanistransport.com"
  method="POST"
>
  <!-- FormSubmit Settings -->
  <input
    type="hidden"
    name="_subject"
    value="New Freight Quote Request | Solanis Transport"
  >

  <input
    type="hidden"
    name="_template"
    value="table"
  >

  <input
    type="hidden"
    name="_next"
    value="https://solanistransport.com/?submitted=true#contact"
  >

  <input
    type="hidden"
    name="_captcha"
    value="false"
  >

  <!-- Spam Protection -->
  <input
    type="text"
    name="_honey"
    tabindex="-1"
    autocomplete="off"
    style="display:none"
  >

  <label>
    Full Name
    <input
      required
      type="text"
      name="Full Name"
      autocomplete="name"
    >
  </label>

  <label>
    Company
    <input
      type="text"
      name="Company"
      autocomplete="organization"
    >
  </label>

  <label>
    Phone
    <input
      required
      type="tel"
      name="Phone"
      autocomplete="tel"
    >
  </label>

  <label>
    Email
    <input
      required
      type="email"
      name="email"
      autocomplete="email"
    >
  </label>

  <label>
    Pickup Location
    <input
      required
      type="text"
      name="Pickup Location"
    >
  </label>

  <label>
    Delivery Location
    <input
      required
      type="text"
      name="Delivery Location"
    >
  </label>

  <label>
    Pickup Date
    <input
      type="date"
      name="Pickup Date"
    >
  </label>

  <label>
    Delivery Date
    <input
      type="date"
      name="Delivery Date"
    >
  </label>

  <label>
    Estimated Weight
    <input
      type="text"
      name="Estimated Weight"
      placeholder="Example: 5,000 lb"
    >
  </label>

  <label>
    Freight Type
    <select name="Freight Type">
      <option>Hotshot Freight</option>
      <option>Expedited Freight</option>
      <option>Dedicated Transport</option>
      <option>Industrial Equipment</option>
      <option>Construction Materials</option>
      <option>Other</option>
    </select>
  </label>

  <label class="full">
    Freight Details
    <textarea
      required
      name="Freight Details"
      rows="5"
      placeholder="Commodity, dimensions, weight, pickup and delivery dates, special instructions, etc."
    ></textarea>
  </label>

  <button
    class="btn btn-gold full"
    type="submit"
  >
    Submit Quote Request
  </button>
</form>
